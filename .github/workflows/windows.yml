name: Windows x64 Beta

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-x64-windows-\${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone --depth 1 https://github.com/microsoft/vcpkg.git C:\vcpkg
            & C:\vcpkg\bootstrap-vcpkg.bat
          }

      - name: Install dependencies
        shell: pwsh
        run: C:\vcpkg\vcpkg.exe install --triplet x64-windows

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Deploy runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build\Release\BeatitDownloadManager.exe package\
          $windeployqt = Get-ChildItem C:\vcpkg\installed\x64-windows\tools -Recurse -Filter windeployqt.exe | Select-Object -First 1
          if (-not $windeployqt) { throw "windeployqt.exe was not found." }
          & $windeployqt.FullName --release --no-translations package\BeatitDownloadManager.exe
          Copy-Item C:\vcpkg\installed\x64-windows\bin\*.dll package\ -ErrorAction SilentlyContinue

      - name: Smoke test
        shell: pwsh
        run: |
          $output = & package\BeatitDownloadManager.exe --version
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "Beatit failed its version smoke test." }
          if (-not (Test-Path package\BeatitDownloadManager.exe)) { throw "Executable missing." }

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath Beatit-0.1.0-beta1-win64-portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beatit-0.1.0-beta1-win64
          path: Beatit-0.1.0-beta1-win64-portable.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Beatit-0.1.0-beta1-win64-portable.zip
          generate_release_notes: true
