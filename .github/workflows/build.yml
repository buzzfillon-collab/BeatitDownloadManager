name: Build Windows x64
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME/vcpkg-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake --build build --config Release

      - name: Bundle Qt DLLs
        shell: pwsh
        run: windeployqt --release build/Release/BeatitDownloadManager.exe

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/Release/* -DestinationPath BeatitDownloadManager-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BeatitDownloadManager-win64
          path: BeatitDownloadManager-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BeatitDownloadManager-win64.zip
