name: Build Windows x64
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-windows-x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME/vcpkg-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake --build build --parallel

      - name: Bundle Qt DLLs
        shell: pwsh
        run: windeployqt --release --no-translations build/BeatitDownloadManager.exe

      - name: Bundle yt-dlp nightly and FFmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp.exe" -OutFile build/tools/yt-dlp.exe
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "$env:RUNNER_TEMP/deno.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/deno.zip" -DestinationPath "$env:RUNNER_TEMP/deno" -Force
          $deno = Get-ChildItem "$env:RUNNER_TEMP/deno" -Filter deno.exe -Recurse | Select-Object -First 1
          if (-not $deno) { throw "Deno binary was not found in the downloaded archive." }
          Copy-Item $deno.FullName build/tools/deno.exe -Force
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP/ffmpeg.zip" -DestinationPath "$env:RUNNER_TEMP/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:RUNNER_TEMP/ffmpeg" -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg binaries were not found in the downloaded archive." }
          Copy-Item $ffmpeg.FullName build/tools/ffmpeg.exe -Force
          Copy-Item $ffprobe.FullName build/tools/ffprobe.exe -Force

      - name: Stage browser integration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/browser/extension | Out-Null
          New-Item -ItemType Directory -Force build/browser/native | Out-Null
          Copy-Item browser/extension/* build/browser/extension/ -Force
          Copy-Item browser/native/*.example.json build/browser/native/ -Force

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/* -DestinationPath BeatitDownloadManager-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BeatitDownloadManager-win64
          path: BeatitDownloadManager-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BeatitDownloadManager-win64.zip
          generate_release_notes: true
