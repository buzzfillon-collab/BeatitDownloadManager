name: Build Windows x64
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python for Qt installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: qt-windows-x64

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ~/vcpkg-cache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME/vcpkg-cache" | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$HOME/vcpkg-cache"
          cmake --build build --parallel

      - name: Bundle Qt DLLs
        shell: pwsh
        run: windeployqt --release --no-translations build/BeatitDownloadManager.exe

      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/* -DestinationPath BeatitDownloadManager-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BeatitDownloadManager-win64
          path: BeatitDownloadManager-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BeatitDownloadManager-win64.zip
          generate_release_notes: true
